spring:
  application:
    name: producer
  main:
    keep-alive: true
  # On SIGTERM, let the scheduler finish the point it is publishing instead of abandoning it mid-send.
  # The producer factory is closed afterwards, which flushes anything still buffered.
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 10s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The consumer models the payload independently and must not be impacted by a
        # type header naming a class from this project.
        spring.json.add.type.headers: false

producer:
  topic: metrics.raw
  series-id: sensor-1
  interval-ms: 100
  mean: 50.0
  standard-deviation: 5.0
  anomaly:
    probability: 0.02
    min-sigma-multiplier: 6.0
    max-sigma-multiplier: 12.0

logging:
  level:
    root: INFO
    com.anomaly: INFO
