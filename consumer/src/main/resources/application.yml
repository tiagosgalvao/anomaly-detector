spring:
  application:
    name: consumer
  main:
    keep-alive: true
  # On SIGTERM the listener container finishes the batch it is holding and commits those offsets before
  # leaving the group, so a restart resumes exactly where this one stopped rather than reprocessing.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: anomaly-detector
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping the JSON deserializer means an unparseable payload surfaces as a failed record the error
      # handler can route away, instead of throwing where nothing can catch it and leaving the partition
      # stuck redelivering the same bytes forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The payload carries no type header, so the target type is stated here.
        # Honouring a header is disabled outright: it would name a class belonging to the producer.
        spring.json.value.default.type: com.anomaly.consumer.DataPoint
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      # Finish the records already polled rather than dropping them where they are.
      immediate-stop: false

consumer:
  topic: metrics.raw
  window-size: 50
  threshold: 3.0
  # Scoring waits for a full window: a partly filled one gives an unstable estimate of the deviation.
  minimum-samples: 50

logging:
  level:
    root: INFO
    com.anomaly: INFO
